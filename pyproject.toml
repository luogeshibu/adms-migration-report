[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-report-tool"
dynamic = ["version"]
description = "Professional configurable Excel/CSV equipment migration review application"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "PySide6>=6.8,<7",
  "openpyxl>=3.1,<4",
]

[project.scripts]
migration-report-tool = "migration_report_tool.app.application:main"

[tool.setuptools.dynamic]
version = {attr = "migration_report_tool.version.__version__"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
